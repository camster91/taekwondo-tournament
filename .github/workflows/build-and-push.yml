name: Build and Push Image

# Reusable build workflow for camster91/* Node.js web apps.
# Triggered after the "CI Build" workflow SUCCEEDS on main (never on PRs,
# never on a red commit), and on version tags. Builds a multi-stage Docker image
# and pushes it to ghcr.io. The image becomes the canonical deployable
# artifact — any host can run it without needing source code, Node, or
# build tools on the host.
#
# Tag strategy (fail-closed artifact publishing):
#   - main: only the immutable :main-<sha> tag (plus the digest). No
#     mutable :main or :latest pointers, so nothing can silently move a
#     tag to an untested build.
#   - version tags (v*): :<version> and :<version>-<sha>.
#   - Image: ghcr.io/camster91/<repo>
#   - Multi-arch: linux/amd64 + linux/arm64 (Raspberry Pi, Apple Silicon hosts)
#   - Buildx layer cache in the GitHub Actions cache (type=gha)
#   - SBOM + provenance attestations enabled (for supply-chain trust)
#
# IMPORTANT: VPS production deployment (scripts/deploy-production.sh) builds
# images from immutable source archives (git SHA), NOT from GHCR. These
# published images are for local testing and non-production deployments only.

on:
  workflow_run:
    workflows: ['CI Build']
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      image_name:
        description: 'Override image name (default: repo name)'
        required: false
        type: string
      dockerfile:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Buildx platforms (default: amd64 only)'
        required: false
        type: string
        default: 'linux/amd64'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Override image name (default: repo name)'
        required: false
        type: string
      dockerfile:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Buildx platforms (default: amd64,arm64)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# A workflow_run always has github.ref = main, so keying on the ref alone let
# a newer CI success cancel the publish of an earlier, different commit
# (leaving that commit with no image). Key on the commit being built: only
# a duplicate run for the same commit is cancelled.
concurrency:
  group: build-${{ github.ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A workflow_run fires for every completed CI run; publish only the
    # exact commit CI passed, and only for pushes to main (not PR runs).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve image metadata
        id: meta
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "${{ inputs.image_name }}" ]; then REPO_NAME="${{ inputs.image_name }}"; fi
          REF="${{ github.ref }}"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG="main"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="${REF#refs/heads/}"
          fi
          SHA_SHORT=$(echo "${SOURCE_SHA}" | head -c 7)
          echo "image=ghcr.io/camster91/${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          build-args: |
            VITE_OFFLINE_CAPABILITY_PUBLIC_KEY_BASE64=${{ vars.OFFLINE_CAPABILITY_PUBLIC_KEY_BASE64 }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT }}
            VITE_CRISP_WEBSITE_ID=${{ vars.VITE_CRISP_WEBSITE_ID }}
            BUILD_SHA=${{ env.SOURCE_SHA }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          # Version tags get :<version> as well; main gets only the
          # immutable :main-<sha>.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', steps.meta.outputs.image, steps.meta.outputs.tag) || '' }}
          # GitHub Actions cache backend: buildx manages and rotates it, so
          # the cache cannot grow unbounded or go stale like a local
          # cache-to directory that is never moved back into place.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ steps.meta.outputs.image }},push=true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Image summary
        run: |
          echo "## Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Primary (immutable):** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** CI-passed commit \`${SOURCE_SHA}\` (no mutable :main / :latest tags)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull (recommended):** \`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Pull by digest:** \`docker pull ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${SOURCE_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** VPS production deployment builds from immutable git archives, not GHCR." >> $GITHUB_STEP_SUMMARY
