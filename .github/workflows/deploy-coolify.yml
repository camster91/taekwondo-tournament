name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Build frontend
        run: npx vite build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production

      - name: Build backend
        run: npx tsc -p tsconfig.server.json

      - name: Trigger Coolify Deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          printf 'Triggering Coolify deploy for app %s\n' "${COOLIFY_APP_UUID}"

          # Fail fast with a clear error if any required secret is missing.
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::error::Missing one of COOLIFY_URL / COOLIFY_TOKEN / COOLIFY_APP_UUID. Add them in repo Settings -> Secrets -> Actions."
            exit 1
          fi

          # 120s timeout (was 30s — too tight for cold Coolify API).
          # Don't use --fail-with-body: it makes curl exit non-zero on HTTP 4xx/5xx,
          # which breaks the `cat /tmp/coolify-resp.txt` below (file never written).
          # Without --fail-with-body, curl exits 0 on any reachable response and
          # HTTP_CODE from -w is reliable.
          HTTP_CODE=$(curl -s --max-time 120 --connect-timeout 10 \
            -o /tmp/coolify-resp.txt \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start" 2>/dev/null) || HTTP_CODE=$?

          echo "Response body:"
          cat /tmp/coolify-resp.txt 2>/dev/null || true
          echo ""
          echo "HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "Deployment queued!"
          else
            echo "Warning: deploy endpoint returned ${HTTP_CODE}"
            # Don't fail the job — build passed; manual deploy is still possible
          fi