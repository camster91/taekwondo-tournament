name: Deploy to Coolify

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Configure required reviewers on the production environment. Combined
    # with workflow_dispatch, production cannot change on a routine merge.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Build frontend
        run: npx vite build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production

      - name: Build backend
        run: npx tsc -p tsconfig.server.json

      - name: Trigger Coolify Deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          printf 'Triggering Coolify deploy for app %s\n' "${COOLIFY_APP_UUID}"

          # Fail fast with a clear error if any required secret is missing.
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$DEPLOY_HEALTHCHECK_URL" ]; then
            echo "::error::Missing Coolify credentials or DEPLOY_HEALTHCHECK_URL. Add them to the protected production environment."
            exit 1
          fi

          # 120s timeout (was 30s — too tight for cold Coolify API).
          # Don't use --fail-with-body: it makes curl exit non-zero on HTTP 4xx/5xx,
          # which breaks the `cat /tmp/coolify-resp.txt` below (file never written).
          # Without --fail-with-body, curl exits 0 on any reachable response and
          # HTTP_CODE from -w is reliable.
          HTTP_CODE=$(curl -s --max-time 120 --connect-timeout 10 \
            -o /tmp/coolify-resp.txt \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start" 2>/dev/null) || HTTP_CODE=$?

          echo "Response body:"
          cat /tmp/coolify-resp.txt 2>/dev/null || true
          echo ""
          echo "HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "Deployment queued!"
          else
            echo "::error::Deploy endpoint returned ${HTTP_CODE}"
            exit 1
          fi

          echo "Waiting for the deployed readiness endpoint..."
          READY=0
          for attempt in $(seq 1 30); do
            echo "Readiness attempt ${attempt}/30"
            if curl --fail --silent --show-error --max-time 10 "${DEPLOY_HEALTHCHECK_URL%/}/api/health/ready" >/dev/null; then
              READY=1
              break
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Deployment was queued but readiness did not pass within five minutes."
            exit 1
          fi
          echo "Deployment readiness passed."
