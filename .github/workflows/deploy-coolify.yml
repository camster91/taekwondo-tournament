name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Build frontend
        run: npx vite build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production

      - name: Build backend
        run: npx tsc -p tsconfig.server.json

      - name: Trigger Coolify Deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          printf 'Triggering Coolify deploy for app %s\n' "${COOLIFY_APP_UUID}"
          HTTP_CODE=$(curl -s -o /tmp/coolify-resp.txt -w '%{http_code}' --max-time 30 \
            -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start")
          echo "Response body:"
          cat /tmp/coolify-resp.txt
          echo ""
          echo "HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "Deployment queued!"
          else
            echo "Warning: deploy endpoint returned ${HTTP_CODE}"
            # Don't fail the job — build passed; manual deploy is still possible
          fi
