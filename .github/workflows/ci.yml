name: CI Build

# Build-only workflow: verifies the project builds cleanly. No deploy, no secrets required.
# Triggered on push to default branch and on PRs targeting it. Manual dispatch available.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 45m gives the three-engine e2e matrix comfortable headroom on
    # the CI runner. If this gets too tight,
    # the scorekeeper tests share login state and could be made
    # faster via test.beforeAll + shared context — see tests/e2e/
    # scorekeeper-a11y.spec.ts.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Node 20 is deprecated on GitHub Actions runners (Sept 2025)
        # and is force-redirected to Node 24. Pin to Node 22 explicitly
        # so the build is deterministic.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # Closes D19: the old typecheck step had continue-on-error: true
        # which meant type errors never failed CI. Now the dedicated
        # `npm run typecheck` script runs both the client and server
        # tsc, and any type error fails the build.
        run: npm run typecheck

      - name: Unit tests
        # Run vitest before lint/build so a failing test short-circuits
        # the pipeline. Vitest doesn't need a real DATABASE_URL (the
        # tests are pure functions on bracket/weight/categorization
        # logic), so the placeholder URL is fine.
        run: npm test
        env:
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        # React Router 7.18.2 has a high advisory in its optional RSC action
        # runtime, which this BrowserRouter SPA does not import or execute.
        # See SECURITY.md. Keep critical findings as a hard release gate.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # CI-safe defaults so the build doesn't depend on real env vars
          NODE_ENV: production
          CI: true
          # Placeholder for prisma generate schema validation (no DB connection is made)
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder

      - name: Install Playwright browsers
        # Required for `npm run test:e2e` below. ~150MB download.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Postgres
        # The e2e suite needs a real Postgres (Prisma driver-adapter
        # won't accept the placeholder). Spin one up on the runner.
        uses: harmon758/postgresql-action@v1
        with:
          # Match the supported production database major version.
          # We override the password to match the project's docker-compose convention.
          postgresql version: '16'
          postgresql db: 'taekwondo_tournament'
          postgresql user: 'taekwondo'
          postgresql password: 'taekwondo'

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://taekwondo:taekwondo@localhost:5432/taekwondo_tournament" >> $GITHUB_ENV

      - name: Migration smoke
        # Closes #19: prove the Prisma schema applies cleanly to a
        # fresh database before any E2E or unit test touches it. If
        # `db:push` fails here, the failure is unambiguous (schema
        # drift) and unrelated to test data, so the developer can
        # bisect to the offending migration candidate.
        #
        # We push the full schema (idempotent — no `--accept-data-loss`)
        # so a destructive column drop introduced on a branch fails
        # the build, exactly the way production would reject it.
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://taekwondo:taekwondo@localhost:5432/taekwondo_tournament
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx

      - name: E2E tests
        # Browser coverage is a hard gate, including scoring, offline replay,
        # accessibility, organization onboarding, and billing webhooks.
        run: npx playwright test --config playwright.config.ts
        env:
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx

  container-smoke:
    name: Container smoke
    # Closes #19: prove the published Docker image actually starts,
    # applies its schema, serves traffic, and answers /health/ready.
    # Independent from `build` so a green image-build does not mask
    # a broken container entrypoint (or vice versa). Runs on every
    # PR and on main pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taekwondo
          POSTGRES_PASSWORD: taekwondo
          POSTGRES_DB: taekwondo_tournament
        ports:
          - 5432:5432
        # Wait for Postgres to actually accept connections before
        # the job steps start. pg_isready exits 0 when the server
        # is up; the health check retries until it does.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        # Only build — don't push. The publish step is
        # build-and-push.yml's job, which has its own billing /
        # publish concerns. This step just needs the image to
        # exist locally so we can `docker run` it.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bowin-tournament-os:ci-smoke

      - name: Run container + wait for /health/ready
        # Override the production CMD (which uses `migrate deploy`
        # against a non-existent migrations dir) with `db push`, so
        # the smoke test exercises the schema-apply path that
        # actually works in this repo per CLAUDE.md. If the
        # Dockerfile is later changed to use real migrations, this
        # override can be removed and the gate will exercise the
        # production entrypoint directly.
        #
        # We retry the health check for up to 60s because Prisma
        # client init + db push + Vite build (in the same image)
        # can take 10-20s on a cold cache.
        run: |
          set -euo pipefail

          # The CI service Postgres is reachable from the host as
          # localhost:5432. From inside the container, host.docker.internal
          # maps to the host gateway, so the container's DATABASE_URL
          # uses that host.
          docker run -d --name smoke \
            -e DATABASE_URL="postgresql://taekwondo:taekwondo@host.docker.internal:5432/taekwondo_tournament" \
            -e JWT_SECRET="ci-throwaway-secret-not-used-in-tests-min-32-chars-xx" \
            --add-host=host.docker.internal:host-gateway \
            -p 3001:3001 \
            bowin-tournament-os:ci-smoke \
            sh -c "./node_modules/.bin/prisma db push --skip-generate && node server.js"

          cleanup() {
            docker logs smoke || true
            docker rm -f smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health/ready > /dev/null 2>&1; then
              echo "Container is ready after ${i} attempts"
              curl -sS http://127.0.0.1:3001/api/health/ready
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready in 60s"
          exit 1
