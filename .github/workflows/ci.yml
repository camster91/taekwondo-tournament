name: CI Build

# Build-only workflow: verifies the project builds cleanly. No deploy, no secrets required.
# Triggered on push to default branch and on PRs targeting it. Manual dispatch available.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (if configured)
        run: |
          if grep -q '"typecheck"\|"type-check"\|"tsc"' package.json; then
            echo "Running typecheck..."
            npm run typecheck || npm run type-check || npx tsc --noEmit
          else
            echo "No typecheck script found, skipping."
          fi
        continue-on-error: true

      - name: Unit tests
        # Run vitest before lint/build so a failing test short-circuits
        # the pipeline. Vitest doesn't need a real DATABASE_URL (the
        # tests are pure functions on bracket/weight/categorization
        # logic), so the placeholder URL is fine.
        run: npm test
        env:
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx

      - name: Lint (if configured)
        run: |
          if grep -q '"lint"' package.json; then
            echo "Running lint..."
            npm run lint
          else
            echo "No lint script found, skipping."
          fi
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # CI-safe defaults so the build doesn't depend on real env vars
          NODE_ENV: production
          CI: true
          # Placeholder for prisma generate schema validation (no DB connection is made)
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder

      - name: Install Playwright browsers
        # Required for `npm run test:e2e` below. ~150MB download.
        run: npx playwright install --with-deps chromium

      - name: Start Postgres
        # The e2e suite needs a real Postgres (Prisma driver-adapter
        # won't accept the placeholder). Spin one up on the runner.
        uses: harmon758/postgresql-action@v1
        with:
          # Defaults: postgres:15, db=postgres, user=postgres, password=postgres
          # We override the password to match the project's docker-compose convention.
          postgresql version: '15'
          postgresql db: 'taekwondo_tournament'
          postgresql user: 'taekwondo'
          postgresql password: 'taekwondo'

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://taekwondo:taekwondo@localhost:5432/taekwondo_tournament" >> $GITHUB_ENV

      - name: E2E tests
        # Run the Playwright e2e suite. ~30s on a runner. Uses the
        # bundled config which has `webServer` to spawn the dev
        # server itself, so the test process owns the lifecycle.
        run: npm run test:e2e
        env:
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx
