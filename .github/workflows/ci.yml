name: CI Build

# Build-only workflow: verifies the project builds cleanly. No deploy, no secrets required.
# Triggered on push to default branch and on PRs targeting it. Manual dispatch available.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 45m gives the three-engine e2e matrix comfortable headroom on
    # the CI runner. If this gets too tight,
    # the scorekeeper tests share login state and could be made
    # faster via test.beforeAll + shared context — see tests/e2e/
    # scorekeeper-a11y.spec.ts.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Node 20 is deprecated on GitHub Actions runners (Sept 2025)
        # and is force-redirected to Node 24. Pin to Node 22 explicitly
        # so the build is deterministic.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # Closes D19: the old typecheck step had continue-on-error: true
        # which meant type errors never failed CI. Now the dedicated
        # `npm run typecheck` script runs both the client and server
        # tsc, and any type error fails the build.
        run: npm run typecheck

      - name: Unit tests
        # Run vitest before lint/build so a failing test short-circuits
        # the pipeline. Vitest doesn't need a real DATABASE_URL (the
        # tests are pure functions on bracket/weight/categorization
        # logic), so the placeholder URL is fine.
        run: npm test
        env:
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        # React Router 7.18.2 has a high advisory in its optional RSC action
        # runtime, which this BrowserRouter SPA does not import or execute.
        # See SECURITY.md. Keep critical findings as a hard release gate.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # CI-safe defaults so the build doesn't depend on real env vars
          NODE_ENV: production
          CI: true
          # Placeholder for prisma generate schema validation (no DB connection is made)
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder

      - name: Install Playwright browsers
        # Required for `npm run test:e2e` below. ~150MB download.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Postgres
        # The e2e suite needs a real Postgres (Prisma driver-adapter
        # won't accept the placeholder). Spin one up on the runner.
        uses: harmon758/postgresql-action@v1
        with:
          # Match the supported production database major version.
          # We override the password to match the project's docker-compose convention.
          postgresql version: '16'
          postgresql db: 'taekwondo_tournament'
          postgresql user: 'taekwondo'
          postgresql password: 'taekwondo'

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://taekwondo:taekwondo@localhost:5432/taekwondo_tournament" >> $GITHUB_ENV

      - name: E2E tests
        # Browser coverage is a hard gate, including scoring, offline replay,
        # accessibility, organization onboarding, and billing webhooks.
        run: npx playwright test --config playwright.config.ts
        env:
          JWT_SECRET: ci-throwaway-secret-not-used-in-tests-min-32-chars-xx
