services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bowin_rebuild_staging
      POSTGRES_USER: bowin_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bowin_rebuild_staging_database_v2:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bowin_staging -d bowin_rebuild_staging]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ./replacement
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?required}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REBUILD_DATABASE_NAME: bowin_rebuild_staging
    command: [node, src/migrate.mjs]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: ./replacement
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?required}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REBUILD_DATABASE_NAME: bowin_rebuild_staging
      APP_ORIGIN: ${APP_ORIGIN:-https://bowin-staging.invalid}
      SETUP_TOKEN: ${SETUP_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  bowin_rebuild_staging_database_v2:
