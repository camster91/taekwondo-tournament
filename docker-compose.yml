version: '3.8'

services:
  martial-arts-tournament:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martial-arts-tournament
    ports:
      - "3001:3001"
    volumes:
      - tournament_data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/tournament.db
    restart: unless-stopped

volumes:
  tournament_data:
