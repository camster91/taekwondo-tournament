version: '3.8'

services:
  martial-arts-tournament:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martial-arts-tournament
    ports:
      - "3001:3001"
    volumes:
      - tournament_data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/tournament.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_SETUP_KEY=${ADMIN_SETUP_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    restart: unless-stopped

volumes:
  tournament_data:
