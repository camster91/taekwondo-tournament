# =============================================================================
# Bowin Tournament OS — local / dev compose file
# =============================================================================
# Host-port policy (closes audit #63):
#   - The `app` service binds ONLY 3001:3001. That single host port is the
#     app's public surface; the app talks to Postgres on the `tkd-net`
#     internal bridge and never reaches the host.
#   - The `taekwondo-db` service has NO `ports:` block at all. The DB is
#     reachable only from containers on the `tkd-net` bridge (i.e. the
#     `app` container). It is NEVER bound to a host port, in dev OR prod.
#   - Do NOT add a line like `- "5432:5432"` (or 3306, 27017, 6379, etc.)
#     to this file. The Postgres password is also required at deploy time
#     via `${POSTGRES_PASSWORD:?...}` with no default; see
#     `.env.example` for the contract.
#
# Production posture (defense in depth):
#   - This file is the dev / local shape. The app's `3001:3001` is the
#     dev loopback binding for `docker compose up`; the DB has no host
#     port and is reachable only from the `tkd-net` bridge.
#   - `docker-compose.prod.yml` is the production override. It
#     re-declares the DB service with `ports: !override []` (Compose
#     v2.24.4+) so the merged production config has ZERO host-bound DB
#     ports, even if a future commit re-introduces a binding in this
#     file. The app service is NOT re-declared: its 3001:3001 binding is
#     intentionally the production host port (Traefik reverse-proxies
#     through it).
#   - `scripts/test-compose-port-hardening.sh` renders the merged config
#     and asserts no service binds a database port (5432/3306/27017) to
#     the host. Run it locally or in CI; it is a hard gate.
#
# Why this matters: any service that lands on the same Coolify / VPS
# host (or that reaches the host via the bastion) would otherwise get
# a free DB shell once a default password leaks. Closes audit #63.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_OFFLINE_CAPABILITY_PUBLIC_KEY_BASE64: ${VITE_OFFLINE_CAPABILITY_PUBLIC_KEY_BASE64:?offline capability public key must be set}
    container_name: martial-arts-tournament
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Require secrets from the host env — never bake production passwords
      # into the compose file.
      - DATABASE_URL=postgresql://taekwondo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@taekwondo-db:5432/taekwondo_tournament
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_SETUP_KEY=${ADMIN_SETUP_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:?MAILGUN_API_KEY must be set}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:?MAILGUN_DOMAIN must be set}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS must be set}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Bowin}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-}
      - DEMO_ISOLATED_DATA=${DEMO_ISOLATED_DATA:-}
      - DEMO_RATE_LIMIT_MAX=${DEMO_RATE_LIMIT_MAX:-30}
      - OFFLINE_CAPABILITY_PRIVATE_KEY_BASE64=${OFFLINE_CAPABILITY_PRIVATE_KEY_BASE64:?offline capability private key must be set}
      # Destructive retention stays opt-in until the operator's policy is approved.
      - RETENTION_PURGE_ENABLED=${RETENTION_PURGE_ENABLED:-false}
      - SOFT_DELETE_RETENTION_DAYS=${SOFT_DELETE_RETENTION_DAYS:-7}
      - REGISTRATION_CONSENT_VERSION=${REGISTRATION_CONSENT_VERSION:?REGISTRATION_CONSENT_VERSION must be set}
      - PRIVACY_NOTICE_URL=${PRIVACY_NOTICE_URL:?PRIVACY_NOTICE_URL must be set}
      - TOURNAMENT_TERMS_URL=${TOURNAMENT_TERMS_URL:?TOURNAMENT_TERMS_URL must be set}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_STARTER_PRICE_ID=${STRIPE_STARTER_PRICE_ID:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
    depends_on:
      taekwondo-db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - tkd-net

  taekwondo-db:
    image: postgres:16-alpine
    container_name: taekwondo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taekwondo_tournament
      POSTGRES_USER: taekwondo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taekwondo -d taekwondo_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - tkd-net

volumes:
  postgres_data:

networks:
  tkd-net:
    driver: bridge
