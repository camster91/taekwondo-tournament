version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martial-arts-tournament
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Require secrets from the host env — never bake production passwords
      # into the compose file.
      - DATABASE_URL=postgresql://taekwondo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@taekwondo-db:5432/taekwondo_tournament
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_SETUP_KEY=${ADMIN_SETUP_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-}
    depends_on:
      taekwondo-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tkd-net

  taekwondo-db:
    image: postgres:16-alpine
    container_name: taekwondo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taekwondo_tournament
      POSTGRES_USER: taekwondo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taekwondo -d taekwondo_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tkd-net

volumes:
  postgres_data:

networks:
  tkd-net:
    driver: bridge
