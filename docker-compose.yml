# Security posture for this compose file (closes audit finding #63):
#
#   - The `app` service binds 3001:3001 so the host / reverse
#     proxy can reach the HTTP server. That is the only host-
#     bound port.
#   - The `taekwondo-db` Postgres service has NO `ports:` block.
#     It is reachable only from the `app` container on the
#     internal `tkd-net` bridge network. Exposing 5432:5432 on
#     the host would let any other container on the same host
#     (or anyone who reaches the host via the bastion) connect
#     to the database with the credentials in
#     POSTGRES_PASSWORD. The audit swarm flagged that pattern
#     across the fleet; this file is the explicit "no" answer.
#   - DB password is required at deploy time via
#     `${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}` —
#     compose refuses to start without it. No default, no
#     baked-in value.
#   - A CI grep in `.github/workflows/ci.yml` fails the build
#     if any `ports: <host>:5432|3306|27017` mapping is
#     re-introduced on a service whose name matches
#     `taekwondo-db` (or any future *-db service).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martial-arts-tournament
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Require secrets from the host env — never bake production passwords
      # into the compose file.
      - DATABASE_URL=postgresql://taekwondo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@taekwondo-db:5432/taekwondo_tournament
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_SETUP_KEY=${ADMIN_SETUP_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:?MAILGUN_API_KEY must be set}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:?MAILGUN_DOMAIN must be set}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS must be set}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Bowin}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-}
      # Destructive retention stays opt-in until the operator's policy is approved.
      - RETENTION_PURGE_ENABLED=${RETENTION_PURGE_ENABLED:-false}
      - SOFT_DELETE_RETENTION_DAYS=${SOFT_DELETE_RETENTION_DAYS:-7}
      - REGISTRATION_CONSENT_VERSION=${REGISTRATION_CONSENT_VERSION:?REGISTRATION_CONSENT_VERSION must be set}
      - PRIVACY_NOTICE_URL=${PRIVACY_NOTICE_URL:?PRIVACY_NOTICE_URL must be set}
      - TOURNAMENT_TERMS_URL=${TOURNAMENT_TERMS_URL:?TOURNAMENT_TERMS_URL must be set}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_STARTER_PRICE_ID=${STRIPE_STARTER_PRICE_ID:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
    depends_on:
      taekwondo-db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - tkd-net

  taekwondo-db:
    image: postgres:16-alpine
    container_name: taekwondo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taekwondo_tournament
      POSTGRES_USER: taekwondo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taekwondo -d taekwondo_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - tkd-net

volumes:
  postgres_data:

networks:
  tkd-net:
    driver: bridge
