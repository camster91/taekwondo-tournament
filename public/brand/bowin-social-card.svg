<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bowin Tournament OS</title>
  <desc id="desc">Tournaments, run like a black belt.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 110) rotate(135) scale(520)">
      <stop stop-color="#E11D48" stop-opacity=".32"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(92 82)">
    <rect width="74" height="74" rx="17" fill="#fff"/>
    <path d="M16 17 37 55 58 17" fill="none" stroke="#0B1220" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="55" r="4.5" fill="#E11D48"/>
    <text x="94" y="55" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2.5">bowin</text>
  </g>
  <text x="92" y="326" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Tournaments, run</text>
  <text x="92" y="410" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">like a <tspan fill="#FB7185">black belt.</tspan></text>
  <text x="96" y="498" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">Registration · Divisions · Brackets · Scorekeeping · Live displays</text>
  <rect x="92" y="552" width="94" height="6" rx="3" fill="#E11D48"/>
</svg>
